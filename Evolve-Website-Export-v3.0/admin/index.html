<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Admin Login | Evolve Clothing Co.</title>
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="login-body">
    
    <div class="login-container">
        <div class="login-header">
            <i class="fa-solid fa-shirt text-gold"></i>
            <h2>Admin Portal</h2>
            <p>Evolve Clothing Co.</p>
        </div>
        
        <form id="loginForm" class="login-form">
            <div id="loginError" class="alert-error" style="display: none;"></div>
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-icon">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="email" required placeholder="admin@evolveclothing.com">
                </div>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-icon">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" required placeholder="Enter your password">
                </div>
            </div>
            
            <button type="submit" id="loginBtn" class="btn-primary">
                <span>Sign In</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>
    </div>

    <!-- Firebase SDK (Modular v10) -->
    <script type="module" src="js/auth.js"></script>
</body>
</html>
